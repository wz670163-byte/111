<title>生日快乐 🎂</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
body { background: #000; }

#screen1, #screen2 {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: opacity 0.8s;
}
#screen1 { background: radial-gradient(ellipse at center, #2d1b4e 0%, #1a0a2e 60%, #0a0518 100%); z-index: 10; }
#screen2 { background: #000; }
.hidden { opacity: 0 !important; pointer-events: none !important; }

/* Stars background */
#stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
.star { position: absolute; border-radius: 50%; background: #fff; animation: twinkle 2s infinite alternate; }
@keyframes twinkle { from { opacity: 0.2; } to { opacity: 0.9; } }

.title-area { text-align: center; margin-bottom: 36px; z-index: 1; }
.title-area h1 { font-size: 30px; color: #ffe8f0; font-weight: 400; letter-spacing: 6px; margin-bottom: 8px; }
.title-area p { font-size: 14px; color: #c9a8d4; letter-spacing: 3px; }

.flowers-deco { display: flex; gap: 16px; justify-content: center; margin-bottom: 28px; z-index: 1; }

.btn-start {
  background: linear-gradient(135deg, #e8b4d0, #c891b8);
  border: none; border-radius: 50px; padding: 14px 44px;
  font-size: 18px; color: #fff; cursor: pointer; letter-spacing: 3px;
  box-shadow: 0 0 24px rgba(200,145,184,0.5);
  transition: transform 0.2s, box-shadow 0.2s;
  z-index: 1;
}
.btn-start:active { transform: scale(0.97); }

/* Screen 2 */
#cake-wrapper { position: relative; width: min(320px, 90vw); }
#cake-wrapper svg { width: 100%; height: auto; transition: filter 2.5s ease; filter: brightness(0.05); }
#cake-wrapper svg.lit { filter: brightness(1); }

.btn-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; justify-content: center; padding: 0 12px; }
.game-btn {
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.25);
  border-radius: 24px; padding: 11px 20px; color: #ffe8f0;
  font-size: 15px; cursor: pointer; letter-spacing: 1px;
  transition: background 0.2s, transform 0.1s;
  -webkit-tap-highlight-color: transparent;
}
.game-btn:active { background: rgba(255,255,255,0.2); transform: scale(0.97); }
.game-btn:disabled { opacity: 0.28; cursor: not-allowed; transform: none; }

#wish-text {
  font-size: 18px; color: #ffd6e7; letter-spacing: 3px;
  text-align: center; margin-top: 10px; height: 28px;
  opacity: 0; transition: opacity 1.5s;
}
#wish-text.show { opacity: 1; }

#fw-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 200; display: none; }
</style>

<script>
// Stars
(function() {
  const c = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random() * 2.5 + 0.5;
    s.style.cssText = `width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;opacity:${Math.random()*0.6+0.2};animation-delay:${Math.random()*3}s;animation-duration:${1.5+Math.random()*2}s`;
    c.appendChild(s);
  }
})();

function goScreen2() {
  document.getElementById('screen1').classList.add('hidden');
  setTimeout(() => document.getElementById('screen2').classList.remove('hidden'), 700);
}

function insertCandles() {
  document.getElementById('candles').style.opacity = '1';
  document.getElementById('btn-candle').disabled = true;
  document.getElementById('btn-light').disabled = false;
}

let audioCtx = null, songNodes = [];

function lightCandles() {
  document.getElementById('btn-light').disabled = true;
  setTimeout(() => {
    document.getElementById('flames').style.opacity = '1';
    document.getElementById('cake-svg').classList.add('lit');
    setTimeout(() => {
      document.getElementById('btn-blow').disabled = false;
      document.getElementById('wish-text').classList.add('show');
      playSong();
    }, 2500);
  }, 400);
}

function playSong() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const f = { F4:349.23,G4:392,Ab4:415.3,A4:440,Bb4:466.16,B4:493.88,C5:523.25,Db5:554.37,D5:587.33,Eb5:622.25,E5:659.25,F5:698.46 };
    const notes = [
      {n:'F4',d:0.75},{n:'F4',d:0.25},{n:'G4',d:1},{n:'F4',d:1},{n:'A4',d:1},{n:'Ab4',d:2},
      {n:'F4',d:0.75},{n:'F4',d:0.25},{n:'G4',d:1},{n:'F4',d:1},{n:'Bb4',d:1},{n:'A4',d:2},
      {n:'F4',d:0.75},{n:'F4',d:0.25},{n:'F5',d:1},{n:'Db5',d:1},{n:'A4',d:1},{n:'G4',d:1},{n:'F4',d:1},
      {n:'Eb5',d:0.75},{n:'Eb5',d:0.25},{n:'Db5',d:1},{n:'A4',d:1},{n:'Bb4',d:1},{n:'A4',d:2},
    ];
    let t = audioCtx.currentTime + 0.3;
    notes.forEach(note => {
      const dur = note.d * 0.48;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.value = f[note.n] || 440;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.22, t + 0.05);
      gain.gain.setValueAtTime(0.22, t + dur - 0.07);
      gain.gain.linearRampToValueAtTime(0, t + dur);
      osc.start(t); osc.stop(t + dur);
      songNodes.push(osc);
      t += dur;
    });
  } catch(e) {}
}

function stopSong() {
  songNodes.forEach(n => { try { n.stop(); } catch(e) {} });
  songNodes = [];
  if (audioCtx) { try { audioCtx.close(); } catch(e) {} audioCtx = null; }
}

function blowCandles() {
  document.getElementById('btn-blow').disabled = true;
  stopSong();
  document.getElementById('wish-text').classList.remove('show');
  document.getElementById('flames').style.opacity = '0';
  setTimeout(startFireworks, 700);
}

// Fireworks
const fwCanvas = document.getElementById('fw-canvas');
const ctx2 = fwCanvas.getContext('2d');
let particles = [], fwRunning = false;

function resizeFW() { fwCanvas.width = window.innerWidth; fwCanvas.height = window.innerHeight; }
window.addEventListener('resize', resizeFW); resizeFW();

function randColor() {
  return ['#ff6b9d','#ffd93d','#6bcb77','#4d96ff','#ff9a3c','#c77dff','#f0f0ff','#ff4d6d'][Math.floor(Math.random()*8)];
}
function burst(x, y) {
  const n = 55 + Math.floor(Math.random()*25), col = randColor();
  for (let i = 0; i < n; i++) {
    const a = (Math.PI*2/n)*i, sp = 2+Math.random()*5;
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, alpha:1, color:col, r:2+Math.random()*2, decay:0.012+Math.random()*0.01 });
  }
}
function animateFW() {
  if (!fwRunning) return;
  ctx2.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
  particles = particles.filter(p => p.alpha > 0.02);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.alpha -= p.decay;
    ctx2.globalAlpha = p.alpha; ctx2.fillStyle = p.color;
    ctx2.beginPath(); ctx2.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx2.fill();
  });
  ctx2.globalAlpha = 1;
  requestAnimationFrame(animateFW);
}
function startFireworks() {
  fwCanvas.style.display = 'block';
  fwRunning = true; animateFW();
  let count = 0;
  const iv = setInterval(() => {
    burst(60 + Math.random()*(window.innerWidth-120), 40 + Math.random()*(window.innerHeight*0.7));
    if (++count > 22) clearInterval(iv);
  }, 380);
}
</script>
